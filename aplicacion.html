<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>URO-VEJIGA 360 · Demostración docente</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Apoyo a la decisión profesional en cáncer de vejiga (EAU 2026). No validada clínicamente.">
<style>/* URO-VEJIGA 360 — tema claro único (petición expresa: fondo claro, navegación azul oscuro, acentos verde petróleo).
   Layout: banda de cabecera y navegación azul oscuro; contenido en columna ancha; el árbol usa dos columnas (datos | resultado). */
:root {
  --navy: #12304a; --navy-2: #1b4466; --navy-ink: #eaf1f7; --navy-muted: #b3c4d4;
  --petrol: #0b6e66; --petrol-strong: #085a53; --petrol-soft: #e2f1ee;
  --bg: #f3f6f7; --surface: #ffffff; --surface-2: #f8fafb; --line: #d3dce2; --line-strong: #b6c3cc;
  --ink: #17212b; --muted: #4a5865; --faint: #56636f;
  --ok: #1e6b3c; --ok-soft: #e4f2e9; --warn: #7a4f00; --warn-soft: #fbf1dc; --crit: #9b2226; --crit-soft: #f8e4e4; --info: #1d4f91; --info-soft: #e6eef9;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-doc: 'Iowan Old Style', 'Charter', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  --r: 6px; --shadow: 0 1px 2px rgba(18, 48, 74, .06), 0 2px 8px rgba(18, 48, 74, .05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
a { color: var(--petrol-strong); }
a:hover { color: var(--navy); }
:focus-visible { outline: 3px solid #12304a; outline-offset: 2px; box-shadow: 0 0 0 5px #ffffff; border-radius: 3px; }
.topbar :focus-visible, .nav :focus-visible { outline-color: #ffd166; box-shadow: none; }
#main:focus, #view h1:focus { outline: none; }
#main:focus-visible { outline: 3px solid #12304a; outline-offset: -3px; }
[id^="card-"], [id^="src-"], [id^="fu-"], [id^="claim-"] { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 9rem); }
.is-target { box-shadow: 0 0 0 3px var(--petrol) !important; background: var(--petrol-soft) !important; }
.skip { position: absolute; left: -999px; top: 0; background: var(--surface); padding: .5rem 1rem; z-index: 50; }
.skip:focus { left: 1rem; top: 1rem; }
h1, h2, h3 { text-wrap: balance; }
.mono { font-family: var(--font-mono); font-size: .86em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Cabecera y navegación ── */
.topbar { background: var(--navy); color: var(--navy-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.topbar .wrap { display: flex; align-items: center; gap: .75rem; padding-block: .6rem; }
.brand { display: flex; align-items: baseline; gap: .6rem; color: var(--navy-ink); text-decoration: none; flex: 0 0 auto; white-space: nowrap; }
.btn-new { flex: none; }
.brand b { font: 700 1.15rem/1 var(--font-ui); letter-spacing: .02em; }
.brand span { font-size: .85rem; color: var(--navy-muted); }
.case-pill { margin-left: auto; flex: 0 1 auto; font-size: .8rem; color: var(--navy-ink); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: .2rem .65rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.case-pill.is-synthetic { border-color: #f0b429; color: #ffe3a3; }
.btn-new { background: var(--surface); color: var(--navy); border: 0; border-radius: var(--r); padding: .45rem .8rem; font: 600 .88rem var(--font-ui); cursor: pointer; }
.btn-new:hover { background: var(--petrol-soft); }
.nav { background: var(--navy-2); }
.nav ol { list-style: none; margin: 0; padding: 0; display: flex; gap: .15rem; overflow-x: auto; scrollbar-width: thin; }
.nav a { display: flex; align-items: baseline; gap: .4rem; padding: .55rem .62rem; color: var(--navy-ink); text-decoration: none; font-size: .9rem; white-space: nowrap; border-bottom: 3px solid transparent; }
.nav a .n { font: 600 .75rem var(--font-mono); color: var(--navy-muted); }
.nav a:hover { background: rgba(255,255,255,.07); }
.nav a[aria-current="page"] { border-bottom-color: #5fd0c2; background: rgba(255,255,255,.08); }
.disclaimer { background: var(--petrol-soft); color: var(--ink); font-size: .82rem; border-bottom: 1px solid var(--line); }
.disclaimer .wrap { padding-block: .45rem; }

main { padding-block: 1.25rem 3rem; }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.view-head h1 { font: 600 1.6rem/1.2 var(--font-doc); margin: 0; color: var(--navy); }
.view-head p { margin: .25rem 0 0; color: var(--muted); max-width: 70ch; }
.eyebrow { font: 600 .74rem/1.2 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--petrol-strong); margin: 0 0 .35rem; }

/* ── Superficies ── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; min-width: 0; }
.panel + .panel { margin-top: 1rem; }
.grid-2 > .panel, .grid-3 > .panel, .sheet-layout .panel { margin-top: 0; }
.sheet-layout .stack > .panel + .panel { margin-top: 0; }
.panel h2 { font: 600 1.1rem/1.3 var(--font-doc); color: var(--navy); margin: 0 0 .6rem; }
.panel h3 { font: 600 .95rem/1.3 var(--font-ui); margin: 1rem 0 .4rem; color: var(--navy); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; vertical-align: top; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
th { background: var(--surface-2); font-weight: 600; color: var(--navy); position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }

/* ── Botones ── */
.btn { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: .42rem .75rem; font: 500 .86rem var(--font-ui); cursor: pointer; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--petrol); color: var(--petrol-strong); }
.btn.primary { background: var(--petrol); border-color: var(--petrol); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--petrol-strong); color: #fff; }
.btn.danger { border-color: var(--crit); color: var(--crit); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.small { padding: .25rem .55rem; font-size: .8rem; }

/* ── Chips y estados (icono + texto, nunca solo color) ── */
.chip { display: inline-flex; align-items: center; gap: .3rem; border-radius: 4px; padding: .12rem .45rem; font: 600 .74rem/1.4 var(--font-ui); border: 1px solid transparent; max-width: 100%; overflow-wrap: anywhere; }
.chip i { font-style: normal; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: #b8dcc5; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: #ecd5a3; }
.chip.crit { background: var(--crit-soft); color: var(--crit); border-color: #e8bcbc; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: #bccde8; }
.chip.neutral { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.chip.petrol { background: var(--petrol-soft); color: var(--petrol-strong); border-color: #b7dbd5; }
.chip.access { font-family: var(--font-mono); font-weight: 600; }

.callout { border-left: 4px solid var(--petrol); background: var(--petrol-soft); padding: .65rem .85rem; border-radius: 0 var(--r) var(--r) 0; font-size: .9rem; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.crit { border-color: var(--crit); background: var(--crit-soft); }
.callout.info { border-color: var(--info); background: var(--info-soft); }
.callout p { margin: .2rem 0; }
.callout strong { color: var(--ink); }

/* ── Portada ── */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; margin-bottom: 1.25rem; }
.hero h1 { font: 600 2rem/1.15 var(--font-doc); color: var(--navy); margin: .2rem 0 .5rem; }
.hero .lead { font-size: 1.02rem; color: var(--muted); max-width: 62ch; margin: 0 0 .75rem; }
.areas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem; }
.area { display: flex; flex-direction: column; gap: .25rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem .9rem; text-decoration: none; color: var(--ink); min-height: 7.2rem; }
.area:hover { border-color: var(--petrol); box-shadow: var(--shadow); }
.area .n { font: 600 .78rem var(--font-mono); color: var(--petrol-strong); }
.area b { font: 600 1rem/1.25 var(--font-ui); color: var(--navy); }
.area span { font-size: .84rem; color: var(--muted); }
.area.audit { border: 2px solid var(--navy); }
.status-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .4rem; font-size: .88rem; }
.status-list li { display: flex; gap: .5rem; align-items: baseline; }
.status-list b { min-width: 8.5rem; color: var(--navy); }
.examples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.example { text-align: left; border: 1px dashed var(--line-strong); background: var(--surface); border-radius: var(--r); padding: .65rem .75rem; cursor: pointer; font: inherit; color: inherit; }
.example:hover { border-color: var(--petrol); }
.example small { display: block; color: var(--muted); margin-top: .2rem; }
.tag-synth { font: 700 .68rem var(--font-ui); letter-spacing: .06em; color: var(--warn); }

/* ── Árbol ── */
.tree { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1rem; align-items: start; }
.scenarios { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem; margin-bottom: 1rem; }
.scn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: .5rem .6rem; cursor: pointer; font: inherit; color: var(--ink); display: flex; gap: .45rem; align-items: baseline; }
.scn .k { font: 700 .82rem var(--font-mono); color: var(--petrol-strong); }
.scn[aria-pressed="true"] { border-color: var(--petrol); background: var(--petrol-soft); box-shadow: inset 3px 0 0 var(--petrol); }
.fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: .7rem .8rem .8rem; margin: 0 0 .75rem; background: var(--surface); }
.fieldset legend { font: 600 .82rem var(--font-ui); color: var(--navy); padding: 0 .3rem; letter-spacing: .02em; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: .2rem; margin-top: .55rem; }
.field label { font-weight: 600; font-size: .86rem; }
.field .help { font-size: .78rem; color: var(--muted); }
.field select, .field input[type="number"], .field input[type="text"], textarea { width: 100%; font: inherit; font-size: .9rem; padding: .4rem .5rem; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: var(--ink); min-width: 0; }
.field.is-missing select, .field.is-missing input { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn); }
.field .flag { font-size: .74rem; font-weight: 600; color: var(--warn); }
.field.is-unknown select { background: var(--surface-2); }
.result { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6.5rem); max-height: calc(100vh - 8rem); overflow: auto; }
.result-summary { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .75rem; }
.level { border-top: 1px solid var(--line); padding-top: .75rem; margin-top: .75rem; }
.level:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.level > h2 { display: flex; align-items: baseline; gap: .5rem; font: 600 1rem/1.3 var(--font-ui) !important; }
.level > h2 .lv { font: 700 .74rem var(--font-mono); color: #fff; background: var(--navy); border-radius: 3px; padding: .05rem .35rem; }
.kv { display: flex; flex-wrap: wrap; gap: .3rem .35rem; }
.kv span { font-size: .78rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: .1rem .4rem; }
.kv span b { font-weight: 600; color: var(--muted); }
.missing { list-style: none; padding: 0; margin: .3rem 0 0; display: grid; gap: .25rem; font-size: .84rem; }
.missing li { display: grid; grid-template-columns: auto 1fr; gap: .4rem; }
.missing button { background: none; border: 0; padding: 0; color: var(--petrol-strong); text-decoration: underline; font: inherit; cursor: pointer; text-align: left; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.steps li { display: grid; grid-template-columns: 1.6rem 1fr; gap: .35rem; font-size: .88rem; }
.steps .ic { display: inline-grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; font: 700 .78rem var(--font-ui); }
.st-ok .ic { background: var(--ok-soft); color: var(--ok); }
.st-no .ic { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.st-indeterminado .ic { background: var(--warn-soft); color: var(--warn); }
.st-bloqueado .ic { background: var(--crit-soft); color: var(--crit); }
.st-info .ic { background: var(--info-soft); color: var(--info); }
.rule-ref { font: 600 .72rem var(--font-mono); color: var(--faint); margin-left: .25rem; }
.claims { display: grid; gap: .45rem; }
.claim { border: 1px solid var(--line); border-radius: 5px; padding: .5rem .6rem; font-size: .84rem; background: var(--surface-2); }
.claim .meta { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; align-items: center; }
.claim.is-pending { background: var(--crit-soft); border-color: #e8bcbc; }
.options { display: grid; gap: .5rem; }
.opt { border: 1px solid var(--line); border-radius: var(--r); padding: .65rem .75rem; background: var(--surface); display: grid; gap: .35rem; }
.opt.role-referencia { border-left: 4px solid var(--petrol); }
.opt.role-no_corresponde, .opt.role-retirado { background: var(--surface-2); }
.opt.is-blocked { opacity: .9; }
.opt-head { display: flex; flex-wrap: wrap; gap: .4rem; align-items: baseline; }
.opt-head b { font-size: .95rem; color: var(--navy); }
.opt p { margin: 0; font-size: .86rem; }
.opt ul { margin: 0; padding-left: 1.1rem; font-size: .82rem; color: var(--muted); }
.axes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .3rem; }
.axis { border: 1px solid var(--line); border-radius: 4px; padding: .25rem .4rem; font-size: .74rem; background: var(--surface-2); min-width: 0; }
.axis b { display: block; font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.opt-actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.why-not { font-size: .78rem; color: var(--muted); }
details.more > summary { cursor: pointer; font-size: .84rem; color: var(--petrol-strong); font-weight: 600; }
details.more[open] > summary { margin-bottom: .4rem; }
.group-title { font: 700 .72rem var(--font-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: .6rem 0 .1rem; }

/* ── Fichas ── */
.filters { display: flex; gap: .6rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
.filters .field { margin: 0; min-width: 12rem; flex: 1 1 12rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: .75rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem .9rem; display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
.card h3 { margin: 0; font: 600 1rem/1.3 var(--font-ui); color: var(--navy); }
.card p { margin: 0; font-size: .86rem; }
.card dl { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: .3rem .6rem; font-size: .83rem; margin: .3rem 0 0; }
.card dt { color: var(--muted); font-weight: 600; }
.card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.reg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3rem; }
.reg div { border: 1px solid var(--line); border-radius: 4px; padding: .3rem .4rem; font-size: .76rem; background: var(--surface-2); }
.reg b { display: block; font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }

/* ── Comparar / tablas ── */
.compare th:first-child, .compare td:first-child { min-width: 9rem; background: var(--surface-2); font-weight: 600; color: var(--navy); }
.compare td { min-width: 13rem; }
.ref-col { box-shadow: inset 0 3px 0 var(--petrol); }
.picker { display: flex; flex-wrap: wrap; gap: .4rem .9rem; }
.picker label { display: flex; gap: .35rem; align-items: center; font-size: .88rem; }

/* ── Presente y futuro ── */
.distinction { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; font: 600 .86rem var(--font-ui); }
.distinction span { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px; padding: .25rem .5rem; }
.distinction em { font-style: normal; color: var(--crit); font-weight: 700; }
.cat-block { margin-top: 1rem; }
.cat-block h2 { display: flex; gap: .5rem; align-items: baseline; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: .35rem; }
.timeline li { display: grid; grid-template-columns: 6.5rem 3rem minmax(0, 1fr); gap: .5rem; font-size: .86rem; align-items: baseline; }
.timeline time { font: 600 .8rem var(--font-mono); color: var(--muted); }

/* ── Ficha del paciente ── */
.sheet-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 1rem; align-items: start; }
.reqs { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; font-size: .85rem; }
.reqs li { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); gap: .3rem; }
.reqs .ic { font-weight: 700; }
.reqs .ok .ic { color: var(--ok); }
.reqs .ko .ic { color: var(--crit); }
.reqs small { display: block; color: var(--muted); }
.preview { background: #fff; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.check { display: flex; gap: .5rem; align-items: flex-start; font-size: .88rem; margin-top: .55rem; }
.check input { margin-top: .2rem; }
#print-area { display: none; }

/* ── Auditoría ── */
.facts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .7rem .8rem; display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.fact b { font: 600 .9rem var(--font-ui); color: var(--navy); }
.fact p { margin: 0; font-size: .82rem; }
.sev-critica { color: var(--crit); }
.qa dt { font-weight: 600; color: var(--navy); margin-top: .7rem; }
.qa dd { margin: .2rem 0 0; font-size: .9rem; }
.pass { color: var(--ok); font-weight: 700; }
.fail { color: var(--crit); font-weight: 700; }
pre.json { white-space: pre-wrap; word-break: break-word; font: .74rem/1.4 var(--font-mono); margin: 0; max-height: 12rem; overflow: auto; background: var(--surface-2); padding: .4rem; border-radius: 4px; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: .6rem .9rem; border-radius: var(--r); box-shadow: var(--shadow); font-size: .88rem; z-index: 40; max-width: min(28rem, calc(100vw - 32px)); }
.confirm-bar { background: var(--warn-soft); border-bottom: 1px solid #ecd5a3; }
.confirm-bar .wrap { display: flex; gap: .75rem; align-items: center; padding-block: .55rem; flex-wrap: wrap; font-size: .9rem; }

@media (max-width: 1080px) {
  .tree, .sheet-layout, .hero { grid-template-columns: minmax(0, 1fr); }
  .result { position: static; max-height: none; }
  .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .examples { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {

    { id: "C-A01", area: "A", texto: "Ante una lesión vesical sospechosa, realizar RTU con estudio anatomopatológico como procedimiento diagnóstico y primer paso terapéutico.", poblacion: "Lesión vesical sospechosa", fuentes: ["S1"], seccion: "§5.9, §5.15", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-A02", area: "A", texto: "Si se va a realizar RM vesical, debe hacerse antes de la RTU.", poblacion: "Lesión vesical sospechosa en la que se plantea RM", fuentes: ["S1"], seccion: "§5.15", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-A03", area: "A", texto: "Realizar una segunda RTU si la RTU inicial fue incompleta o hay dudas sobre su completitud; si la muestra no contiene músculo detrusor (excepto en Ta LG/G1 y en CIS primario); y en tumores T1. El texto añade la indicación en Ta HG sin músculo en la pieza.", poblacion: "Tras RTU inicial de CVNMI", fuentes: ["S1"], seccion: "§5.13, §5.15", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-A04", area: "A", texto: "La segunda RTU se realiza entre 2 y 6 semanas después de la inicial e incluye la resección del lecho del tumor primario.", poblacion: "Pacientes con indicación de re-RTU", fuentes: ["S1"], seccion: "§5.15", fuerza: "Débil", acceso: "a", estado: "verificada" },
    { id: "C-A05", area: "A", texto: "Con citología positiva y cistoscopia sin tumor visible, descartar carcinoma del tracto urinario superior, CIS vesical (biopsias de mapeo o guiadas por PDD) y tumor de uretra prostática. Las biopsias de mapeo incluyen trígono, cúpula y paredes derecha, izquierda, anterior y posterior.", poblacion: "Citología positiva sin lesión visible", fuentes: ["S1"], seccion: "§5.11, §5.15", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-A06", area: "A", texto: "Biopsiar la uretra prostática si hay citología positiva sin tumor vesical o anomalías visibles en ella (Fuerte), y en tumores del cuello vesical, sospecha de CIS o tumores T1 (Débil). Zona preferente: precolicular, entre las 5 y las 7 horarias.", poblacion: "Pacientes con uretra prostática", fuentes: ["S1"], seccion: "§5.11.2", fuerza: "Fuerte / Débil según supuesto", acceso: "a", estado: "verificada" },
    { id: "C-A07", area: "A", texto: "La cistoscopia con fluorescencia (PDD) detecta más tumores, sobre todo CIS, pero es menos específica (63 % frente a 81 %) y da falsos positivos en los 3 meses siguientes a la BCG. Un ECA británico no redujo recurrencias ni fue coste-efectivo a 3 años. Usar métodos de mejora de la visualización si están disponibles.", poblacion: "Sospecha de CIS o tumor no visible", fuentes: ["S1"], seccion: "§5.12", fuerza: "Débil", acceso: "a", estado: "verificada" },
    { id: "C-A08", area: "A", texto: "Graduar con la clasificación OMS 2004/2022; si es posible, con un sistema híbrido 1973 + 2004/2022. No existe correspondencia automática entre G1/G2/G3 y LG/HG: en la cohorte de referencia los G2 se repartieron entre LG y HG. Para la tabla de riesgo basta uno de los dos sistemas.", poblacion: "Informe anatomopatológico de CVNMI", fuentes: ["S1"], seccion: "§4.5, tabla 6.2", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-A09", area: "A", texto: "La OMS 2022 considera de alto grado todos los subtipos histológicos, cuyo porcentaje debe informarse. Los subtipos micropapilar, plasmocitoide, sarcomatoide, en nidos y neuroendocrino, y la invasión linfovascular, sitúan el CVNMI en muy alto riesgo.", poblacion: "CVNMI con subtipo histológico o ILV", fuentes: ["S1"], seccion: "Tablas 6.1 y 6.2", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-A10", area: "A", texto: "AUA/SUO 2024: re-RTU en 4–6 semanas si se plantea preservación vesical con histología variante (opinión de expertos).", poblacion: "Histología variante con intención de preservación", fuentes: ["S8"], seccion: "Enunciado 7", fuerza: "Opinión de expertos (AUA 2024)", acceso: "b", estado: "antecedente", incertidumbre: "Versión sustituida por la enmienda AUA/SUO 2026, no consultada." },
    { id: "C-A11", area: "A", texto: "El tratamiento específico de histologías no uroteliales (carcinoma escamoso puro, adenocarcinoma, carcinoma de células pequeñas) no se verificó en la guía extendida EAU MIBC 2026.", poblacion: "Histologías no uroteliales", fuentes: ["S5"], seccion: "—", fuerza: "—", acceso: "d", estado: "pendiente" },
    // ───────── B. CVNMI ─────────
    { id: "C-B01", area: "B", texto: "Estratificar el CVNMI en cuatro grupos de riesgo (bajo, intermedio, alto y muy alto) con el modelo EAU 2021 (calculadora en nmibc.net).", poblacion: "CVNMI tras RTU", fuentes: ["S1"], seccion: "§6, tabla 6.2", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B02", area: "B", texto: "Factores clínicos adicionales del modelo: edad mayor de 70 años, tumores papilares múltiples y diámetro mayor de 3 cm. El grupo de bajo riesgo exige diámetro menor de 3 cm. El texto no asigna el valor de 3,0 cm exactos.", poblacion: "CVNMI papilar", fuentes: ["S1"], seccion: "Tabla 6.2", fuerza: "Sin grado", acceso: "a", estado: "verificada", incertidumbre: "Frontera de 3,0 cm no resuelta en el texto consultado; el motor evalúa ambas lecturas." },
    { id: "C-B03", area: "B", texto: "Bajo riesgo: tumor primario, único, TaT1 LG/G1, menor de 3 cm, sin CIS y en paciente de 70 años o menos; o tumor primario Ta LG/G1 sin CIS con como máximo uno de los factores clínicos adicionales.", poblacion: "CVNMI papilar primario", fuentes: ["S1"], seccion: "Tabla 6.2", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B04", area: "B", texto: "Riesgo intermedio: pacientes sin CIS que no cumplen criterios de bajo, alto ni muy alto riesgo.", poblacion: "CVNMI sin CIS", fuentes: ["S1"], seccion: "Tabla 6.2", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B05", area: "B", texto: "Alto riesgo: todos los T1 HG/G3 sin CIS y todos los pacientes con CIS, salvo los de muy alto riesgo; Ta LG/G2 o T1 G1 sin CIS con los tres factores; Ta HG/G3 o T1 LG sin CIS con al menos dos factores; T1 G2 sin CIS con al menos uno.", poblacion: "CVNMI", fuentes: ["S1"], seccion: "Tabla 6.2", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B06", area: "B", texto: "Muy alto riesgo: Ta HG/G3 con CIS y los tres factores; T1 G2 con CIS y al menos dos; T1 HG/G3 con CIS y al menos uno; T1 HG/G3 sin CIS con los tres. Además, todo paciente con CIS en uretra prostática, con determinados subtipos de carcinoma urotelial o con invasión linfovascular.", poblacion: "CVNMI", fuentes: ["S1"], seccion: "Tabla 6.2", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B07", area: "B", texto: "El CIS primario aislado (puro) se considera de alto riesgo. El modelo EAU 2021 no incluyó pacientes con CIS primario, por lo que los factores propios de tumores papilares (número, tamaño) no se le aplican.", poblacion: "CIS primario puro", fuentes: ["S1"], seccion: "Tabla 6.2 y texto", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B08", area: "B", texto: "Los tumores recurrentes se clasifican como de riesgo intermedio, alto o muy alto según los demás factores; nunca como de bajo riesgo.", poblacion: "CVNMI recurrente", fuentes: ["S1"], seccion: "Tabla 6.2 y texto", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B10", area: "B", texto: "Ofrecer una instilación única inmediata de quimioterapia a pacientes con tumores presumiblemente de bajo riesgo y a pacientes con recidivas papilares pequeñas (presumiblemente Ta LG/G1) detectadas más de un año después de la RTU previa.", poblacion: "Bajo riesgo presunto; recidiva pequeña tardía", fuentes: ["S1", "S2"], seccion: "§7.4.2, §7.10", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B11", area: "B", texto: "La instilación inmediata se administra dentro de las 24 horas (Débil); el texto la prefiere en las 2 primeras horas.", poblacion: "Candidatos a instilación inmediata", fuentes: ["S2"], seccion: "§7.4.2, §7.10", fuerza: "Débil", acceso: "a", estado: "verificada" },
    { id: "C-B12", area: "B", texto: "Omitir la instilación inmediata ante perforación vesical manifiesta o sospechada, o sangrado que requiera irrigación vesical.", poblacion: "Candidatos a instilación inmediata", fuentes: ["S2"], seccion: "§7.10", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B13", area: "B", texto: "Fuera de esos supuestos, la instilación única es un tratamiento incompleto. No fue eficaz con puntuación de recurrencia EORTC mayor de 5 ni con más de una recurrencia al año.", poblacion: "CVNMI de riesgo intermedio o superior", fuentes: ["S2"], seccion: "§7.4.2", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B14", area: "B", texto: "Si la instilación inmediata no es factible, la guía recoge la irrigación vesical continua con suero o agua como alternativa.", poblacion: "Candidatos a instilación inmediata en los que no es factible", fuentes: ["S2"], seccion: "§7.10", fuerza: "Fuerte", acceso: "a", estado: "verificada", incertidumbre: "Su aplicabilidad concreta en caso de perforación no se detalla en la base; decisión clínica." },
    { id: "C-B15", area: "B", texto: "Quimioterapia intravesical: el esquema óptimo no está definido y no debería superar un año (Débil). Ajustar el pH urinario y reducir la ingesta de líquidos (Fuerte). Mantener cada instilación 1–2 horas (Débil). Fármacos con eficacia: mitomicina, epirrubicina, pirarrubicina y gemcitabina.", poblacion: "CVNMI de riesgo intermedio", fuentes: ["S2"], seccion: "§7.4.2, §7.10", fuerza: "Débil / Fuerte según enunciado", acceso: "a", estado: "verificada" },
    { id: "C-B16", area: "B", texto: "BCG: inducción de 6 semanas y mantenimiento con 3 instilaciones semanales a los 3, 6, 12, 18, 24, 30 y 36 meses. Tres años de mantenimiento superan a uno en alto riesgo; en riesgo intermedio no aportan más que un año. El esquema reducido de NIMBUS fue inferior. Un tercio de dosis podría ser la mínima eficaz en riesgo intermedio; un sexto pierde eficacia. Ninguna cepa ha demostrado superioridad.", poblacion: "CVNMI intermedio, alto y muy alto", fuentes: ["S2"], seccion: "§7.4.3", fuerza: "Sin grado (LE 1a para el esquema)", acceso: "a", estado: "verificada" },
    { id: "C-B17", area: "B", texto: "Contraindicaciones absolutas de la BCG intravesical: primeras 2 semanas tras la RTU, hematuria visible, sondaje traumático e infección urinaria sintomática.", poblacion: "Candidatos a BCG", fuentes: ["S2"], seccion: "§7.10", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B18a", area: "B", texto: "Bajo riesgo: ofrecer una instilación inmediata de quimioterapia tras la RTU.", poblacion: "CVNMI de bajo riesgo", fuentes: ["S2"], seccion: "§7.11", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B18b", area: "B", texto: "Riesgo intermedio: la quimioterapia intravesical (esquema óptimo desconocido) es una primera opción razonable; un año de BCG a dosis completa es una alternativa.", poblacion: "CVNMI de riesgo intermedio", fuentes: ["S2"], seccion: "§7.11", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B18c", area: "B", texto: "Alto riesgo: ofrecer BCG intravesical a dosis completa de uno a tres años y comentar la cistectomía radical inmediata.", poblacion: "CVNMI de alto riesgo", fuentes: ["S2"], seccion: "§7.11", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B18d", area: "B", texto: "Muy alto riesgo: ofrecer cistectomía radical o BCG intravesical a dosis completa de uno a tres años, en particular a quienes rechazan la cistectomía o no son aptos para ella.", poblacion: "CVNMI de muy alto riesgo", fuentes: ["S2"], seccion: "§7.6, §7.11", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-B19", area: "B", texto: "Las recidivas Ta LG pequeñas pueden tratarse con fulguración ambulatoria (Fuerte). Ofrecer vigilancia activa o quimioablación a pacientes seleccionados con tumores presumiblemente LG (Débil). Un ECA de láser ambulatorio fue no inferior en Ta LG recurrente de 1,5 cm o menos. No aplicable a T1, alto grado ni CIS.", poblacion: "Ta LG recurrente pequeño seleccionado", fuentes: ["S2"], seccion: "§7.2, §7.3, §7.10", fuerza: "Fuerte / Débil según opción", acceso: "a", estado: "verificada" },
    { id: "C-B20", area: "B", texto: "UGN-102 (mitomicina en hidrogel): ATLAS, 282 pacientes, respuesta completa a 3 meses del 65 % frente al 64 % con RTU; ENVISION, 240 pacientes, respuesta completa del 79 %, mantenida en el 82 % al año (texto EAU). FDA (12/06/2025): Zusduri para CVNMI LG de riesgo intermedio recurrente; 78 % de respuesta completa en 223 evaluables y 79 % de los respondedores la mantuvieron 12 meses o más; efectos adversos graves en el 12 %; retención urinaria en el 0,8 %.", poblacion: "CVNMI LG de riesgo intermedio recurrente", fuentes: ["S2", "S10"], seccion: "§7.5; nota FDA", fuerza: "Sin grado", acceso: "b", estado: "verificada", incertidumbre: "Situación en la EMA y la AEMPS no verificada." },
    { id: "C-B21", area: "B", texto: "Gemcitabina/docetaxel en pacientes sin BCG previa: solo datos retrospectivos; la EAU lo considera un concepto emergente pendiente de evaluación prospectiva. BRIDGE/EA8212 (NCT05538663), fase III de no inferioridad frente a BCG con SLE como desenlace primario: registro ACTIVE_NOT_RECRUITING (verificado 09/2026), finalización primaria estimada 01/11/2029, sin resultados.", poblacion: "CVNMI de alto riesgo sin BCG previa", fuentes: ["S2", "S15"], seccion: "§7.4.4.c; registro", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B22", area: "B", texto: "Tratamientos asistidos por dispositivo: dos ECA de quimioterapia hipertérmica (HIVEC) en riesgo intermedio fueron negativos frente a la quimioterapia estándar (SLE a 24 meses 61 % frente a 60 %) y con más abandonos. RITE: un ECA con mejor supervivencia libre de recurrencia que BCG a un año. EMDA+BCG: un ECA pequeño.", poblacion: "CVNMI seleccionado", fuentes: ["S2"], seccion: "§7.4.2.c.2", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-B23", area: "B", texto: "EAU 2026: comentar beneficios y daños de añadir sasanlimab o durvalumab a la BCG con mantenimiento en pacientes seleccionados sin BCG previa con CVNMI de alto o muy alto riesgo. CREST (sasanlimab): SLE a 36 meses 82,1 % frente a 74,8 % (HR 0,68), analizado con 150 de 389 eventos previstos; grado ≥3 en el 29,8 % frente al 6,3 %. POTOMAC (durvalumab): SLE a 2 años 86,5 % frente a 81,6 % (HR 0,68); grado 3–4 en el 21 % frente al 4 %. Sin beneficio cuando la BCG se dio solo en inducción. ALBAN (atezolizumab) fue negativo (HR 0,98).", poblacion: "CVNMI alto/muy alto riesgo sin BCG previa", fuentes: ["S2"], seccion: "§7.4.4.d, §7.10", fuerza: "Fuerte («comentar»)", acceso: "a", estado: "verificada" },
    { id: "C-B24", area: "B", texto: "Situación regulatoria de inmunoterapia + BCG sin BCG previa: la FDA aprobó durvalumab+BCG (28/05/2026). En la UE se retiraron las solicitudes de sasanlimab (13/02/2026) y de durvalumab+BCG en CVNMI (24/06/2026). No hay autorización en la UE para esta indicación.", poblacion: "CVNMI alto/muy alto riesgo sin BCG previa", fuentes: ["S11", "S14", "S26"], seccion: "Notas regulatorias", fuerza: "—", acceso: "b", estado: "verificada" },
    { id: "C-B26", area: "B", texto: "Instilación única inmediata: en un metaanálisis de datos individuales, la recurrencia a 5 años pasó del 59 % al 45 %.", poblacion: "CVNMI tras RTU", fuentes: [], seccion: "—", fuerza: "—", acceso: "d", estado: "pendiente", incertidumbre: "Cifra recogida en el informe de Fase 1 y atribuida al texto EAU, sin sección registrada; no pudo recomprobarse el 22/10/2026 (uroweb no accesible). No se muestra en las fichas." },
    { id: "C-B27", area: "B", texto: "Quimioterapia intravesical: en un metaanálisis, las odds de recurrencia a 1 año fueron un 44 % menores.", poblacion: "CVNMI de riesgo intermedio", fuentes: [], seccion: "—", fuerza: "—", acceso: "d", estado: "pendiente", incertidumbre: "Cifra recogida en el informe de Fase 1 y atribuida al texto EAU, sin sección registrada; no pudo recomprobarse el 22/10/2026 (uroweb no accesible). No se muestra en las fichas." },
    { id: "C-B28", area: "B", texto: "BCG: en el metaanálisis EORTC la progresión fue del 9,8 % frente al 13,8 %. Efectos adversos graves en menos del 5 %; más del 50 % de los pacientes no completa un año de tratamiento.", poblacion: "CVNMI tratado con BCG", fuentes: [], seccion: "—", fuerza: "—", acceso: "d", estado: "pendiente", incertidumbre: "Cifra recogida en el informe de Fase 1 y atribuida al texto EAU, sin sección registrada; no pudo recomprobarse el 22/10/2026 (uroweb no accesible). No se muestra en las fichas." },
    { id: "C-B25", area: "B", texto: "KEYNOTE-676 (pembrolizumab + BCG) y SunRISe-3 (TAR-200 en pacientes sin BCG previa): resultados no verificados en esta base.", poblacion: "CVNMI alto riesgo", fuentes: ["S2"], seccion: "—", fuerza: "—", acceso: "d", estado: "pendiente" },
    // ───────── C. Después de BCG ─────────
    { id: "C-C01", area: "C", texto: "BCG adecuada: al menos 5 de 6 dosis de la inducción inicial más al menos 2 de 6 dosis de una segunda inducción o 2 de 3 dosis de mantenimiento. La ficha técnica FDA de pembrolizumab usa la misma definición.", poblacion: "Pacientes tratados con BCG", fuentes: ["S2", "S16"], seccion: "Tabla de categorías de fracaso de BCG", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C02", area: "C", texto: "BCG-refractario: T1 HG/G3 presente a los 3 meses; Ta HG/G3 tras 3 meses y/o a los 6 meses, después de reinducción o del primer ciclo de mantenimiento; CIS presente a los 3 meses que persiste a los 6 meses; o tumor HG que aparece durante el mantenimiento.", poblacion: "Pacientes tratados con BCG", fuentes: ["S2"], seccion: "Tabla de categorías de fracaso", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C03", area: "C", texto: "BCG-recidivante: recidiva de tumor HG/G3 después de completar el mantenimiento con BCG, pese a una respuesta inicial.", poblacion: "Pacientes tratados con BCG", fuentes: ["S2"], seccion: "Tabla de categorías de fracaso", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C04", area: "C", texto: "BCG-unresponsive: todos los tumores BCG-refractarios y los pacientes que desarrollan recidiva Ta/T1 HG en los 6 meses, o CIS en los 12 meses, siguientes a completar una exposición adecuada a BCG.", poblacion: "Pacientes tratados con BCG", fuentes: ["S2", "S16"], seccion: "Tabla de categorías de fracaso", fuerza: "Sin grado", acceso: "a", estado: "verificada", incertidumbre: "«En los 6 meses» se codifica como ≤ 6,0 meses (idem 12,0); interpretación documentada en la regla." },
    { id: "C-C05", area: "C", texto: "BCG-exposed: (1) BCG-resistente: Ta HG o CIS a los 3 meses tras al menos 5 de 6 dosis de inducción, sin exposición adecuada; (2) recaída diferida tras BCG inadecuada: libre de tumor a los 3 meses y recidiva entre 6 y 24 meses sin haber recibido más que una inducción; (3) recaída diferida tras BCG adecuada: HG fuera de la ventana de BCG-unresponsive (más de 6 meses en Ta/T1, más de 12 en CIS) y hasta 24 meses.", poblacion: "Pacientes tratados con BCG", fuentes: ["S2"], seccion: "Tabla de categorías de fracaso", fuerza: "Sin grado", acceso: "a", estado: "verificada", incertidumbre: "En el supuesto (2) la base no precisa desde qué fecha se cuentan los 6–24 meses; el motor usa la última dosis de BCG y lo señala." },
    { id: "C-C06", area: "C", texto: "Intolerancia a la BCG: efectos adversos graves que impiden seguir instilando antes de completar el tratamiento. Es una categoría distinta de la resistencia.", poblacion: "Pacientes tratados con BCG", fuentes: ["S2"], seccion: "Tabla de categorías de fracaso", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C07", area: "C", texto: "La recidiva de bajo grado tras BCG no se considera fracaso de la BCG; el tratamiento se individualiza.", poblacion: "Recidiva LG tras BCG", fuentes: ["S2"], seccion: "Tabla de categorías; §7.8.2.d", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C08", area: "C", texto: "Progresión: detección de un tumor músculo-invasivo durante el seguimiento.", poblacion: "Pacientes tratados con BCG", fuentes: ["S2"], seccion: "Tabla de categorías", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C09", area: "C", texto: "Definición FDA (ficha de pembrolizumab): enfermedad persistente pese a BCG adecuada, recidiva tras un estado libre de tumor inicial después de BCG adecuada, o enfermedad T1 tras una sola inducción.", poblacion: "Ensayos y etiquetas en BCG-unresponsive", fuentes: ["S16"], seccion: "§1, §14", fuerza: "—", acceso: "b", estado: "verificada", incertidumbre: "La guía FDA 2018/2024 no se consultó directamente." },
    { id: "C-C10", area: "C", texto: "En el CVNMI BCG-unresponsive, la cistectomía radical es la opción estándar y preferida; los tratamientos distintos de la cistectomía deben considerarse oncológicamente inferiores (LE 3). Ofrecer cistectomía radical (Fuerte). A quienes no son candidatos o la rechazan, ofrecer estrategias de preservación, preferiblemente en ensayos clínicos (Débil). Las opciones nuevas en ensayo se prefieren a la reexposición a BCG.", poblacion: "CVNMI BCG-unresponsive", fuentes: ["S2"], seccion: "§7.6, §7.8.2.b, §7.8.3", fuerza: "Fuerte (cistectomía) / Débil (preservación)", acceso: "a", estado: "verificada" },
    { id: "C-C11", area: "C", texto: "Repetir BCG es apropiado en recidivas no HG y en recidivas HG tardías (más de un año). Los pacientes BCG-exposed y las recaídas tardías de más de 24 meses probablemente se benefician de más BCG. No corresponde en BCG-unresponsive.", poblacion: "Recidiva tras BCG", fuentes: ["S2"], seccion: "§7.8.2.c", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C20", area: "C", texto: "Pembrolizumab intravenoso (KEYNOTE-057, cohorte A, CIS ± papilar, n = 96): respuesta completa a 3 meses del 41 %; el 46 % de los respondedores la mantuvo 12 meses o más. Cohorte B (papilar): SLE a 12 meses del 43,5 %. FDA: aprobado el 08/01/2020 para CIS ± papilar en pacientes no elegibles para cistectomía o que deciden no operarse. No autorizado en la UE para CVNMI.", poblacion: "BCG-unresponsive con CIS", fuentes: ["S2", "S16"], seccion: "Tablas de rescate", fuerza: "Sin grado", acceso: "a", estado: "verificada", incertidumbre: "La retirada de la solicitud en la EMA (~2020–21) no está confirmada." },
    { id: "C-C21", area: "C", texto: "Nadofaragén firadenovec (fase III; CIS n = 103, Ta/T1 n = 48): respuesta completa en CIS del 53,4 %; el 45 % seguía en respuesta al año. Supervivencia libre de recurrencia HG a 57 meses del 13 % (CIS) y del 33 % (Ta/T1); supervivencia libre de cistectomía a 60 meses del 49 %; efectos de grado 3 en el 4 % o menos. FDA (16/12/2022): CIS ± papilar BCG-unresponsive (51 % en 98 evaluables según el resumen FDA; difiere por el denominador). UE: autorización condicional el 28/05/2026 para CIS ± papilar.", poblacion: "BCG-unresponsive con CIS", fuentes: ["S2", "S13", "S24"], seccion: "Tablas de rescate; dictamen CHMP", fuerza: "Sin grado", acceso: "b", estado: "verificada" },
    { id: "C-C22", area: "C", texto: "Nogapendekin alfa inbakicept + BCG (QUILT-3.032; CIS n = 82, papilar n = 72): respuesta completa en CIS del 55 %, 56 % y 45 % a 3, 6 y 12 meses; papilar: SLE a 12 meses del 55,4 %. FDA: aprobado en 04/2024 (CIS ± papilar). UE: autorización condicional el 16/02/2026 para CIS ± papilar. La ampliación FDA a papilar aislado (10/2026) solo consta en un titular.", poblacion: "BCG-unresponsive con CIS", fuentes: ["S2", "S12", "S32"], seccion: "Tablas de rescate; EPAR", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C23", area: "C", texto: "TAR-200 (sistema intravesical de liberación de gemcitabina; SunRISe-1, cohorte 2, CIS ± papilar, n = 85): respuesta completa del 82,4 %; duración mediana de la respuesta 25,8 meses; 45,9 % en respuesta a 12 meses; grado ≥3 en el 12,9 %. FDA: Inlexzo aprobado el 09/09/2025. Situación en la UE no verificada.", poblacion: "BCG-unresponsive con CIS", fuentes: ["S2", "S33", "S37"], seccion: "Tablas de rescate", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C24", area: "C", texto: "Cretostimogén grenadenorepvec (BOND-003, CIS ± Ta/T1): respuesta completa a 24 meses del 41,8 % según comunicado de la empresa. No aprobado en ningún territorio; solicitud BLA en curso.", poblacion: "BCG-unresponsive con CIS", fuentes: ["S31"], seccion: "Comunicado", fuerza: "—", acceso: "b", estado: "verificada" },
    { id: "C-C25", area: "C", texto: "Gemcitabina/docetaxel en BCG-unresponsive: datos retrospectivos (n = 102) con supervivencia libre de recurrencia HG del 65 % a 12 meses y del 49 % a 24 meses. Uso fuera de ficha técnica. La AUA 2024 lo incluía como opción (grado C).", poblacion: "BCG-unresponsive", fuentes: ["S2", "S8"], seccion: "Tablas de rescate; enunciado AUA 2024", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C26", area: "C", texto: "Atezolizumab (SWOG S1605, CIS n = 74): respuesta completa a 6 meses del 27 %; no alcanzó el umbral del ensayo.", poblacion: "BCG-unresponsive con CIS", fuentes: ["S2"], seccion: "Tablas de rescate", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C27", area: "C", texto: "Erdafitinib en CVNMI (THOR-2, papilar HG con alteración de FGFR): HR de supervivencia libre de recurrencia 0,28 frente a quimioterapia. Sin autorización en CVNMI.", poblacion: "CVNMI papilar HG con FGFR alterado", fuentes: ["S2"], seccion: "Tablas de rescate", fuerza: "Sin grado", acceso: "a", estado: "verificada" },
    { id: "C-C28", area: "C", texto: "Conducta específica tras exposición insuficiente a BCG (menos de 5 de 6 dosis de inducción) o tras intolerancia: no codificada en esta base.", poblacion: "Exposición insuficiente o intolerancia", fuentes: ["S2"], seccion: "—", fuerza: "—", acceso: "d", estado: "pendiente" },
    // ───────── D. CVMI localizado y regional ─────────
    { id: "C-D01", area: "D", texto: "Ofrecer cistectomía radical a pacientes con enfermedad T2–T4a N0 M0.", poblacion: "CVMI T2–T4a N0 M0", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-D02", area: "D", texto: "La linfadenectomía es parte integral de la cistectomía; la extensión estándar es la de referencia porque la extendida no mejora la supervivencia y aumenta la morbilidad.", poblacion: "Candidatos a cistectomía", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-D03", area: "D", texto: "No retrasar la cistectomía más de 3 meses salvo que se administre tratamiento neoadyuvante.", poblacion: "Candidatos a cistectomía", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-D04", area: "D", texto: "Realizar la cistectomía en centros con al menos 20 cistectomías al año.", poblacion: "Candidatos a cistectomía", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-D05", area: "D", texto: "Ofrecer quimioinmunoterapia perioperatoria con cisplatino/gemcitabina y durvalumab a pacientes con CVMI T2–T4a cN0-1 M0 aptos para cisplatino (se admite FG ≥ 40 ml/min) y para inmunoterapia. El texto extendido describe cisplatino fraccionado con FG de 40–60 ml/min.", poblacion: "CVMI apto para cisplatino e inmunoterapia", fuentes: ["S5", "S20", "S6"], seccion: "Pocket; §6.5.1.c; resumen de cambios", fuerza: "Fuerte", acceso: "a", estado: "discrepancia", incertidumbre: "El pocket y el texto extendido dicen cN0-1 y FG ≥ 40; el resumen de cambios dice cN0 y FG > 40. Con cN1 o FG de 40 exactos el motor exige revisión." },
    { id: "C-D06", area: "D", texto: "Ofrecer enfortumab vedotina más pembrolizumab perioperatorios a pacientes con CVMI no aptos para quimioterapia con cisplatino.", poblacion: "CVMI no apto para cisplatino", fuentes: ["S5", "S20"], seccion: "Pocket; §6.5.1.c", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-D07", area: "D", texto: "Ofrecer quimioterapia neoadyuvante con combinación basada en cisplatino a pacientes con CVMI T2–T4a cN0-1 M0 aptos para cisplatino.", poblacion: "CVMI apto para cisplatino", fuentes: ["S5", "S20"], seccion: "Pocket; §6.5.1.c", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-D08", area: "D", texto: "No ofrecer quimioterapia neoadyuvante con carboplatino a pacientes no aptos para cisplatino.", poblacion: "CVMI no apto para cisplatino", fuentes: ["S5", "S20"], seccion: "Pocket; §6.5.1.c", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-D09", area: "D", texto: "Ofrecer cistectomía radical o terapia trimodal como opción curativa primaria, porque son más eficaces que la radioterapia sola (Fuerte). No ofrecer radioterapia sola como tratamiento primario del cáncer vesical localizado (Fuerte). La radioterapia externa sola solo se considera si el paciente no es apto para cistectomía ni para quimiorradioterapia. Gestionar a todos los candidatos a TMT en comité multidisciplinar con decisión compartida (Fuerte).", poblacion: "CVMI localizado", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada", incertidumbre: "Texto literal: «unfit for cystectomy or chemoradiation». El motor lo interpreta como no apto para ninguna de las dos opciones curativas (lectura más restrictiva)." },
    { id: "C-D10", area: "D", texto: "La TMT es más adecuada en tumores cT2–T3a solitarios y unifocales, sin CIS extenso o multifocal, sin hidronefrosis o con hidronefrosis unilateral y con buena función vesical basal; también puede considerarse en pacientes no aptos para cistectomía o que no desean operarse. Radiosensibilizantes citados: cisplatino, mitomicina C + 5-FU y gemcitabina; sin cisplatino, 5-FU/mitomicina C o gemcitabina a dosis bajas.", poblacion: "Candidatos a TMT", fuentes: ["S20"], seccion: "§6.8.1", fuerza: "Sin grado (texto narrativo)", acceso: "b", estado: "verificada" },
    { id: "C-D11", area: "D", texto: "La estrategia en enfermedad ganglionar cN2–3 M0 (quimioterapia de inducción y consolidación local) no se verificó: las recomendaciones consultadas cubren cN0-1.", poblacion: "cN2–3 M0", fuentes: ["S20"], seccion: "§6.5.1.c", fuerza: "—", acceso: "d", estado: "pendiente" },
    { id: "C-D12", area: "D", texto: "No ofrecer radioterapia preoperatoria en CVMI operable (Fuerte). La radioterapia adyuvante del lecho de cistectomía y los ganglios pélvicos puede ofrecerse en pT3b–4, ganglios positivos o márgenes positivos para mejorar el control locorregional, pero no la supervivencia global (Débil).", poblacion: "CVMI operado o candidato", fuentes: ["S5", "S20"], seccion: "§6.6.3", fuerza: "Fuerte / Débil", acceso: "a", estado: "verificada" },
    { id: "C-D13", area: "D", texto: "Los criterios concretos de no aptitud para cisplatino (p. ej., criterios de Galsky: ECOG, aclaramiento de creatinina, audición, neuropatía, insuficiencia cardiaca) no se verificaron en el texto EAU 2026 consultado.", poblacion: "CVMI", fuentes: ["S20"], seccion: "—", fuerza: "—", acceso: "d", estado: "pendiente" },
    { id: "C-D14", area: "D", texto: "EV-304 (EV+pembrolizumab perioperatorio en aptos para cisplatino): SLE a 24 meses 79,4 % frente a 66,2 % (HR 0,53); el HR de supervivencia global se publica como 0,65 o 0,63 según la fuente. FDA: aprobado el 10/07/2026 para todos los candidatos a cistectomía. CHMP: dictamen positivo el 18/09/2026; el EPAR actualizado el 24/09/2026 aún limita la indicación perioperatoria UE a no aptos para cisplatino. La guía EAU 2026 no lo incorpora. Toxicidad: exantema en el 63 % (nota consultada).", poblacion: "CVMI apto para cisplatino", fuentes: ["S18", "S29", "S30", "S39"], seccion: "Notas", fuerza: "—", acceso: "b", estado: "discrepancia", incertidumbre: "HR de supervivencia global discordante entre fuentes; decisión de la CE no verificada." },
    { id: "C-D15", area: "D", texto: "NIAGARA: aprobado por la EMA en julio de 2025 y por la FDA el 28/03/2025 (durvalumab con gemcitabina y cisplatino neoadyuvante, seguido de durvalumab adyuvante tras la cistectomía; 1.063 pacientes aleatorizados).", poblacion: "CVMI apto para cisplatino", fuentes: ["S6", "S22", "S27"], seccion: "Notas regulatorias", fuerza: "—", acceso: "b", estado: "verificada" },
    { id: "C-D16", area: "D", texto: "EV-303 (EV+pembrolizumab perioperatorio en no aptos para cisplatino): FDA en noviembre de 2025; Comisión Europea en junio de 2026. Reducción del riesgo de evento del 60 % y de muerte del 50 % según la nota consultada.", poblacion: "CVMI no apto para cisplatino", fuentes: ["S28", "S18", "S39"], seccion: "Notas; EPAR (indicación UE literal: no aptos para cisplatino)", fuerza: "—", acceso: "b", estado: "verificada" },
    { id: "C-D17", area: "D", texto: "AUA/ASCO/ASTRO/SUO (2024): no ofrecer radioterapia sola como tratamiento curativo (fragmento consultado).", poblacion: "CVMI", fuentes: ["S9"], seccion: "Fragmento", fuerza: "No verificada", acceso: "b", estado: "verificada" },
    // ───────── E. Después de cistectomía ─────────
    { id: "C-E01", area: "E", texto: "El informe patológico de la cistectomía debe recoger pT, márgenes (radial, próstata, uréter, uretra), número total de ganglios y de ganglios positivos, extensión extranodal, invasión linfovascular y CIS.", poblacion: "Tras cistectomía", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-E02", area: "E", texto: "Ofrecer quimioterapia adyuvante con combinación basada en cisplatino a pacientes con pT3/4 y/o pN+ si no recibieron tratamiento sistémico neoadyuvante.", poblacion: "pT3/4 y/o pN+ sin neoadyuvancia", fuentes: ["S5", "S20"], seccion: "§6.5.2.c", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-E03", area: "E", texto: "Ofrecer nivolumab adyuvante en carcinoma urotelial músculo-invasivo de alto riesgo (≥ ypT2N0 tras neoadyuvancia, o pT3/4 y/o pN+) en pacientes no aptos para cisplatino adyuvante o que lo rechazan. FDA: con independencia de PD-L1. EMA: solo con expresión de PD-L1 en células tumorales ≥ 1 %.", poblacion: "Alto riesgo tras cistectomía", fuentes: ["S5", "S20"], seccion: "§6.5.2.c", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-E04", area: "E", texto: "Pembrolizumab adyuvante (AMBASSADOR) mejoró la supervivencia libre de enfermedad según el texto EAU, sin recomendación específica en la guía. Situación en la UE no verificada.", poblacion: "Alto riesgo tras cistectomía", fuentes: ["S5", "S20"], seccion: "§6.5.2.b", fuerza: "Sin recomendación", acceso: "a", estado: "verificada" },
    { id: "C-E05", area: "E", texto: "IMvigor010 (atezolizumab adyuvante no seleccionado) fue negativo.", poblacion: "Alto riesgo tras cistectomía", fuentes: ["S5"], seccion: "Texto", fuerza: "—", acceso: "a", estado: "verificada" },
    { id: "C-E06", area: "E", texto: "IMvigor011: la EAU recoge que la adyuvancia guiada por ctDNA mejora la SLE y la SG, sin recomendación formal graduada. FDA (15/05/2026): atezolizumab en enfermedad mínima residual detectada por ctDNA con prueba autorizada (Signatera CDx); 250 pacientes aleatorizados 2:1; reducción relativa del riesgo de recurrencia o muerte del 36 % y de muerte del 41 %. EMA: no verificado.", poblacion: "ctDNA positivo tras cistectomía", fuentes: ["S20", "S38", "S17"], seccion: "§6.5.2.c; notas FDA", fuerza: "Sin recomendación", acceso: "b", estado: "verificada" },
    { id: "C-E07", area: "E", texto: "Si el paciente recibió un esquema perioperatorio (gemcitabina/cisplatino + durvalumab, o EV + pembrolizumab), la fase adyuvante forma parte del mismo esquema según el diseño de los ensayos y las etiquetas; no se añade otra adyuvancia independiente.", poblacion: "Tras esquema perioperatorio", fuentes: ["S22", "S28", "S29"], seccion: "Diseño de ensayos", fuerza: "—", acceso: "b", estado: "verificada" },
    { id: "C-E08", area: "E", texto: "Realizar TC de reestadificación tras el tratamiento neoadyuvante para descartar progresión local y metástasis.", poblacion: "Tras neoadyuvancia", fuentes: ["S5", "S21"], seccion: "§7.1.1", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    // ───────── F. Enfermedad avanzada ─────────
    { id: "C-F01", area: "F", texto: "El algoritmo EAU de primera línea considera elegible para combinación a quien tiene ECOG 0–2 y FG > 30 ml/min; para cisplatino exige FG > 50 ml/min.", poblacion: "Carcinoma urotelial irresecable o metastásico", fuentes: ["S5"], seccion: "Diagrama de primera línea", fuerza: "Sin grado (diagrama)", acceso: "a", estado: "verificada" },
    { id: "C-F02", area: "F", texto: "Primera línea en pacientes elegibles para combinación: enfortumab vedotina + pembrolizumab.", poblacion: "Primera línea, elegible para combinación", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-F03", area: "F", texto: "Si EV está contraindicado o no disponible: quimioterapia con platino + gemcitabina seguida de avelumab de mantenimiento en pacientes con al menos enfermedad estable tras la quimioterapia.", poblacion: "Primera línea sin EV", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-F04", area: "F", texto: "Si EV está contraindicado y el paciente es apto para cisplatino: cisplatino/gemcitabina + nivolumab.", poblacion: "Primera línea sin EV, apto para cisplatino", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-F05", area: "F", texto: "Si EV y los inhibidores de checkpoint están contraindicados: quimioterapia con platino.", poblacion: "Primera línea sin EV ni inmunoterapia", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-F06", area: "F", texto: "En pacientes no elegibles para combinación, pembrolizumab o atezolizumab en monoterapia si PD-L1 es alto.", poblacion: "Primera línea, no elegible para combinación", fuentes: ["S5"], seccion: "Pocket", fuerza: "Débil", acceso: "a", estado: "verificada", incertidumbre: "La definición de PD-L1 alto no se verificó (guía extendida)." },
    { id: "C-F07", area: "F", texto: "Tras EV + inhibidor de checkpoint: quimioterapia combinada con platino (cisplatino o carboplatino + gemcitabina) (Débil); erdafitinib si hay alteración de FGFR accionable (Fuerte); quimioterapia en monoterapia (docetaxel, paclitaxel, vinflunina) (Débil).", poblacion: "Progresión tras EV + inmunoterapia", fuentes: ["S5"], seccion: "Pocket", fuerza: "Débil / Fuerte según opción", acceso: "a", estado: "verificada" },
    { id: "C-F08", area: "F", texto: "Tras platino ± inhibidor de checkpoint: EV (Fuerte); erdafitinib si hay alteración de FGFR y exposición previa a inhibidor de checkpoint (Fuerte); pembrolizumab si no hubo inhibidor de checkpoint previo (Fuerte); considerar quimioterapia en monoterapia (docetaxel, paclitaxel, vinflunina) (Débil).", poblacion: "Progresión tras platino", fuentes: ["S5"], seccion: "Pocket (recomprobado el 22/10/2026)", fuerza: "Fuerte / Débil según opción", acceso: "a", estado: "verificada" },
    { id: "C-F09", area: "F", texto: "En líneas posteriores: trastuzumab deruxtecán si HER2 por IHC 3+, y considerarlo si 2+ (Débil). Ofrecer ensayos clínicos o tratamiento de soporte exclusivo (Fuerte).", poblacion: "Líneas posteriores", fuentes: ["S5"], seccion: "Pocket", fuerza: "Débil / Fuerte", acceso: "a", estado: "verificada" },
    { id: "C-F10", area: "F", texto: "Determinar FGFR3 para seleccionar erdafitinib (Fuerte) y HER2 por IHC (Débil). No hay evidencia suficiente para usar TMB ni firmas moleculares.", poblacion: "Enfermedad avanzada", fuentes: ["S5"], seccion: "Pocket", fuerza: "Fuerte / Débil", acceso: "a", estado: "verificada" },
    { id: "C-F11", area: "F", texto: "Sacituzumab govitecán: tras TROPiCS-04 (sin beneficio en SG ni SLP), la aprobación acelerada FDA en carcinoma urotelial se retiró voluntariamente (anuncio 18/10/2024; eliminada de la etiqueta el 22/11/2024). La EAU 2026 lo eliminó.", poblacion: "Carcinoma urotelial avanzado", fuentes: ["S36", "S6"], seccion: "Notas", fuerza: "—", acceso: "b", estado: "verificada" },
    { id: "C-F12", area: "F", texto: "FDA: indicación de durvalumab en carcinoma urotelial metastásico retirada en 2021; aprobación acelerada de atezolizumab en carcinoma urotelial retirada en 2022.", poblacion: "Carcinoma urotelial avanzado", fuentes: ["S17"], seccion: "Notas", fuerza: "—", acceso: "b", estado: "verificada", incertidumbre: "Situación UE de atezolizumab en monoterapia no verificada." },
    { id: "C-F13", area: "F", texto: "La ficha FDA de pembrolizumab (Keytruda Qlex) incluye como progresión tras platino la ocurrida en los 12 meses siguientes a quimioterapia neoadyuvante o adyuvante con platino. La EAU no da un umbral explícito para la reexposición tras EV+P o inmunoterapia perioperatoria (no verificado).", poblacion: "Recaída tras tratamiento perioperatorio", fuentes: ["S25"], seccion: "Indicaciones", fuerza: "—", acceso: "b", estado: "verificada", incertidumbre: "Umbral EAU de reexposición pendiente." },

      state.ficha = { ...state.ficha, [t.dataset.sheet]: t.type === "checkbox" ? t.checked : t.value };
      state.editado = true;
      recompute();
      render();
    }
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.dataset.sheet && t.tagName === "TEXTAREA") {
      const wasReviewed = state.ficha.revisada;
      state.ficha = { ...state.ficha, [t.dataset.sheet]: t.value };
      state.editado = true;
      recompute();
      if (wasReviewed && !state.ficha.revisada) {
        render();
        announce("La revisión previa se ha invalidado: la ficha vuelve a ser un borrador.");
        return;
      }
      refreshSheetPanels();
      t.setAttribute("aria-invalid", String(identificadoresEnFicha(state.ficha).some((x) => x.campoId === t.dataset.sheet)));
    } else if (t.dataset.filter === "q") {
      state.fichasFiltro = { ...state.fichasFiltro, q: t.value };
      clearTimeout(t._deb);
      t._deb = setTimeout(() => render(), 250);
    }
  });
  window.addEventListener("hashchange", onHash);
  window.addEventListener("popstate", onHash);
  window.addEventListener("beforeunload", (ev) => {
    if (caseHasRealData()) {
      ev.preventDefault();
      ev.returnValue = "";
    }
  });
  function init() {
    document.documentElement.lang = "es";
    const live = document.createElement("div");
    live.id = "live";
    live.className = "sr-only";
    live.setAttribute("aria-live", "polite");
    live.setAttribute("role", "status");
    document.body.appendChild(live);
    const pa = document.createElement("div");
    pa.id = "print-area";
    pa.setAttribute("aria-hidden", "true");
    document.body.appendChild(pa);
    const st = document.createElement("style");
    st.textContent = SHEET_CSS;
    document.head.appendChild(st);
    recompute();
    onHash();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
  window.__UV360__ = { getState: () => JSON.parse(JSON.stringify(state)), getResult: () => JSON.parse(JSON.stringify(result)) };
})();
</script>
